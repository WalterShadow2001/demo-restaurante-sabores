<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Sabores de Delicias">
  <title>Sabores de Delicias</title>
  <desc>Emblema circular con tenedor y cuchillo cruzados, plato con monograma SD, vapor y chile.</desc>

  <!-- Background disc (cream) -->
  <circle cx="100" cy="100" r="96" fill="#FAF7F2"/>

  <!-- Outer ring (terracotta) -->
  <circle cx="100" cy="100" r="93" fill="none" stroke="#B8543D" stroke-width="5"/>

  <!-- Inner thin ring (warm gold) -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#D4A574" stroke-width="1.6"/>

  <!-- Folk-art decorative dots (olive) between the rings, 12 around -->
  <g fill="#7A8C4C">
    <circle cx="188"    cy="100"    r="2.2"/>
    <circle cx="176.21" cy="144"    r="2.2"/>
    <circle cx="144"    cy="176.21" r="2.2"/>
    <circle cx="100"    cy="188"    r="2.2"/>
    <circle cx="56"     cy="176.21" r="2.2"/>
    <circle cx="23.79"  cy="144"    r="2.2"/>
    <circle cx="12"     cy="100"    r="2.2"/>
    <circle cx="23.79"  cy="56"     r="2.2"/>
    <circle cx="56"     cy="23.79"  r="2.2"/>
    <circle cx="100"    cy="12"     r="2.2"/>
    <circle cx="144"    cy="23.79"  r="2.2"/>
    <circle cx="176.21" cy="56"     r="2.2"/>
  </g>

  <!-- Small folk-art diamond accents at the 4 cardinal points (inside the dots) -->
  <g fill="#D4A574">
    <path d="M100 6 l3 6 -3 6 -3 -6 z"/>
    <path d="M100 182 l3 6 -3 6 -3 -6 z" opacity="0"/>
  </g>

  <!-- Crossed FORK (tilted -22deg around centre) -->
  <g transform="rotate(-22 100 100)" fill="#3E2C20">
    <!-- handle -->
    <rect x="88.5" y="78" width="3" height="28" rx="1.5"/>
    <!-- tine base / shoulder -->
    <rect x="84" y="72" width="12" height="8" rx="2.6"/>
    <!-- three tines -->
    <rect x="85"   y="52" width="2.2" height="22" rx="1.1"/>
    <rect x="88.9" y="48" width="2.2" height="26" rx="1.1"/>
    <rect x="92.8" y="52" width="2.2" height="22" rx="1.1"/>
  </g>

  <!-- Crossed KNIFE (tilted +22deg around centre) -->
  <g transform="rotate(22 100 100)">
    <!-- handle (dark brown) -->
    <rect x="98.5" y="78" width="3" height="26" rx="1.5" fill="#3E2C20"/>
    <!-- bolster (gold) -->
    <rect x="97" y="74" width="6" height="5" rx="1.5" fill="#D4A574"/>
    <!-- blade (gold with dark outline, tapered to a tip) -->
    <path d="M97 74 L103 74 L101.6 50 Q100 46.5 98.4 50 Z"
          fill="#D4A574" stroke="#3E2C20" stroke-width="1.1" stroke-linejoin="round"/>
  </g>

  <!-- Steam wisps rising from the plate -->
  <g fill="none" stroke="#7A8C4C" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <path d="M90 110 Q86 104 90 98 Q94 92 90 86"/>
    <path d="M100 112 Q104 106 100 100 Q96 94 100 88"/>
    <path d="M110 110 Q114 104 110 98 Q106 92 110 86"/>
  </g>

  <!-- Plate (terracotta disc) -->
  <circle cx="100" cy="132" r="24" fill="#B8543D"/>
  <!-- Plate inner ring (gold) -->
  <circle cx="100" cy="132" r="19" fill="none" stroke="#D4A574" stroke-width="1.6"/>
  <!-- Plate rim shading -->
  <circle cx="100" cy="132" r="24" fill="none" stroke="#3E2C20" stroke-width="0.9" opacity="0.35"/>

  <!-- SD monogram on the plate -->
  <text x="100" y="139" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="17" font-weight="700" fill="#FAF7F2" letter-spacing="0.5">SD</text>

  <!-- Chili pepper accent at the bottom -->
  <g transform="translate(100 168) rotate(18)">
    <!-- stem -->
    <path d="M0 -6 Q2.5 -8 5 -7" fill="none" stroke="#7A8C4C" stroke-width="1.4" stroke-linecap="round"/>
    <!-- pod body (curved teardrop) -->
    <path d="M0 -5 Q-5 -3 -6 3 Q-6 8 -2 9 Q1 8 2 5 Q3 8 6 9 Q9 8 9 4 Q8 -2 3 -5 Q1.5 -5 0 -5 Z"
          fill="#7A8C4C"/>
    <!-- soft highlight -->
    <path d="M-2 -1 Q-3.5 3 -2.5 6" fill="none" stroke="#FAF7F2" stroke-width="0.7" opacity="0.5" stroke-linecap="round"/>
  </g>
</svg>
